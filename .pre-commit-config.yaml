repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the version uv.lock resolves, so the hook, `make lint` and CI
    # all run the same binary. It was pinned at v0.6.9 against a resolved
    # 0.15.x, and the two disagreed: the hook failed on a UP038 that the
    # project's own ruff no longer reports. Bump this and the lock together.
    rev: v0.15.13
    hooks:
      - id: ruff
        name: ruff (whole repo)
        args: [--fix]
      - id: ruff-format
        name: ruff-format (whole repo)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: check-merge-conflict
