name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type check & tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dev environment
        # hpc is an optional-dependency extra (flash-attn/bitsandbytes), not a
        # dependency-group — uv sync omits extras by default, so nothing extra
        # to exclude here.
        run: uv sync --group dev
      # Fail-fast: any step below failing fails the run.
      # Strict lint on the maintained core; research scripts are held to
      # formatting-only (same scoping rationale as mypy below).
      # Correctness rules run everywhere, including the research scripts: a
      # refactor once removed an import that was still used, and scoping ruff
      # to the core meant CI never saw the resulting NameError.
      - name: Ruff undefined names (whole repo)
        run: uv run ruff check --select F821,F811,F822 .
      - name: Ruff check (core)
        run: uv run ruff check models/ data/ tests/
      - name: Ruff format (whole repo)
        run: uv run ruff format --check .
      - name: Mypy (models/, data/)
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      # The demo is the repo's headline artefact and the only check that runs
      # the real training scripts end to end. The unit suite can stay green
      # while the pipeline itself is broken — that is exactly the regression
      # this step exists to catch. ~20s, CPU-only, no network (HF_HUB_OFFLINE).
      - name: Demo pipeline (CPU, end to end)
        run: uv run python demo/run_demo.py
      - name: Upload demo report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            demo_output/demo_report.md
            demo_output/logs/
          if-no-files-found: ignore
