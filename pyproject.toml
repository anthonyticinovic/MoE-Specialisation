[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-specialisation"
version = "0.1.0"
description = "Mixture-of-Experts vision-language model (custom MoE Mistral-7B): a vision expert and a text expert per FFN layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anthony Ticinovic", email = "apticinovic@gmail.com" }]
keywords = ["mixture-of-experts", "vision-language-model", "mistral", "multimodal", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # Floored at 4.56: `from_pretrained(dtype=...)` was introduced there, and
    # the older `torch_dtype=` spelling now logs a deprecation warning on every
    # model load. Capped below 5: the paper was produced on the transformers 4.x
    # line and v5 changes Mistral model internals (a numerics/behaviour
    # boundary). uv.lock pins the exact version the results were produced with.
    "transformers>=4.56.0,<5",
    "datasets>=2.14.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
    "pycocotools>=2.0.7",
    "pycocoevalcap>=1.2",
]

[project.optional-dependencies]
# Stage 3 distributed training extras. flash-attn requires --no-build-isolation
# and is intentionally excluded from CI.
hpc = [
    "flash-attn>=2.3.0",
    "bitsandbytes>=0.41.0",
]

[project.urls]
Repository = "https://github.com/anthonyticinovic/MoE-Specialisation"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The research scripts used to be exempt from E501, F841, B007 and B006. Every
# one of those now passes repo-wide, so the exemption is gone: an exemption
# nothing needs is a claim that the code is worse than it is, and it hid a
# mutable default argument for months.
# Tests: allow assert-style checks
"tests/*" = ["S101"]

[tool.mypy]
# Scoped to core library packages only — training/analysis scripts not typed
files = ["models", "data"]
ignore_missing_imports = true
# Lenient: catches real bugs without requiring full annotation coverage
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These three subclass / drive untyped PyTorch & transformers internals
# (nn.Module.__getattr__ -> "Tensor | Module", the HF config_class override,
# dynamic self.mlp reassignment). Those errors are framework friction, not
# real bugs, and the model files are frozen (ruff-only) by the
# conservative-refactor constraint.
#
# data/LLaVA_loader.py used to be here too, for six errors that were nothing
# of the kind: one function built two lists and then rebound the same names to
# tensors. Splitting that function gave each name one type and the exclusion
# went with it. Do not add a module here without first checking which of the
# two cases it is.
module = [
    "models.utils.create_moe_model",
    "models.custom_mistral",
    "models.moe_layer",
]
ignore_errors = true

[tool.hatch.build.targets.wheel]
# Existing flat packages — DO NOT move to a src/ layout or rename:
# create_moe_model.py copies these files into checkpoint dirs for
# trust_remote_code (auto_map: "custom_mistral.MistralMoEConfig").
packages = ["models", "data"]
